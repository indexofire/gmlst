site_name: gmlst
site_description: Fast bacterial genome typing with MLST, cgMLST, and scheme-free discovery
site_author: indexofire
site_url: https://indexofire.github.io/gmlst/

repo_name: indexofire/gmlst
repo_url: https://github.com/indexofire/gmlst

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # mkdocs-static-i18n configures Material's header language selector
      # (extra.alternate) and the per-language search stemmer automatically.
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Installation: 安装
            Quick Start: 快速开始
            Installation Guide: 安装指南
            Configuration: 配置参考
            Pipelines: 流水线集成
            Usage: 使用
            CLI Reference: CLI 参考
            Typing: 分型
            Scheme: Scheme
            Utils: 工具
            Visual: 可视化命令
            Alignment Backends: 比对后端
            Data Providers: 数据源
            cgMLST Guide: cgMLST 指南
            Novel Workflow: Novel 工作流
            Visualization: 可视化
            Fingerprint Database: 指纹数据库
            Architecture: 架构
            Overview: 概览
            Modules and Layers: 模块与分层
            CLI Layer: CLI 层
            Typing Pipeline: 分型流水线
            Cache Management: 缓存管理
            Workflows: 工作流
            Reference: 参考
            General Questions: 一般问题
            Schemes: 方案
            Output: 输出
            Performance: 性能
            Errors: 错误与退出码
            Development: 开发
            Setup: 开发环境
            Workflow: 开发工作流
            Code Style: 代码风格
            Extending: 扩展
            Testing: 测试
            Documentation: 文档
            Frontend: 前端
            Pull Requests: Pull Request
            Release: 发布流程

theme:
  name: material
  language: en
  # Desktop: top tabs + section landing pages + right-hand TOC. The primary
  # sidebar is hidden by stylesheets/extra.css; tablet/mobile keep the drawer.
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation:
    - installation/index.md
    - Quick Start: installation/quick-start.md
    - Installation Guide: installation/guide.md
    - Configuration: installation/configuration.md
    - Pipelines: installation/pipelines.md
  - Usage:
    - usage/index.md
    - CLI Reference:
      - usage/cli/index.md
      - Typing: usage/cli/typing.md
      - Scheme: usage/cli/scheme.md
      - Utils: usage/cli/utils.md
      - Visual: usage/cli/visual.md
    - Alignment Backends: usage/backends.md
    - Data Providers: usage/providers.md
    - cgMLST Guide: usage/cgmlst.md
    - Novel Workflow: usage/novel-workflow.md
    - Visualization: usage/visualization.md
    - Fingerprint Database: usage/fingerprint-database.md
  - Architecture:
    - architecture/index.md
    - Overview: architecture/overview.md
    - Modules and Layers: architecture/modules.md
    - CLI Layer: architecture/cli.md
    - Typing Pipeline: architecture/typing-pipeline.md
    - Alignment Backends: architecture/backends.md
    - Database Providers: architecture/providers.md
    - Cache Management: architecture/cache.md
    - Workflows: architecture/workflows.md
    - Visualization: architecture/visualization.md
  - Reference:
    - reference/index.md
    - General Questions: reference/general.md
    - Installation: reference/installation.md
    - Schemes: reference/schemes.md
    - Typing: reference/typing.md
    - Output: reference/output.md
    - Configuration: reference/configuration.md
    - Performance: reference/performance.md
    - Errors: reference/errors.md
  - Development:
    - development/index.md
    - Setup: development/setup.md
    - Workflow: development/workflow.md
    - Code Style: development/code-style.md
    - Extending: development/extending.md
    - Testing: development/testing.md
    - Documentation: development/docs.md
    - Frontend: development/frontend.md
    - Pull Requests: development/pull-requests.md
    - Release: development/release.md

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css
